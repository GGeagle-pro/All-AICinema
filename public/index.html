<body>
  <header class="topbar" id="topbar">
    <div class="topbar__inner">
      <a class="brand" href="./" aria-label="All AI-Cinema 홈">
        <img class="brand__mark" src="assets/logo.svg?v=2" alt="" width="30" height="30" /><span class="brand__name">All AI-Cinema</span>
      </a>
      <form class="search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.2 4.2-1.4 1.4-4.2-4.2A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
        <input id="q" type="search" placeholder="제목·채널 검색" autocomplete="off" enterkeyhint="search" aria-label="영상 검색" />
      </form>
      <button id="searchBtn" class="search-btn" type="button" aria-label="검색 열기" aria-expanded="false" aria-controls="q">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.2 4.2-1.4 1.4-4.2-4.2A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
      </button>
    </div>
    <!-- 1줄: 장르·국가 (관리자 > 메뉴·배너 에서 편집) -->
    <!-- 0줄: 나라 (한국·미국·일본·중국 – 관리자 카테고리에 같은 이름으로 채널에 지정) -->
    <nav class="menu menu--countries" id="countries" aria-label="나라"></nav>
    <nav class="menu" id="cats" aria-label="장르"></nav>
    <!-- 2줄: 유튜브 채널 -->
    <div class="chrow" id="chrow">
      <nav class="menu menu--channels" id="chs" aria-label="유튜브 채널"></nav>
      <!-- 채널이 한 줄을 넘치면 나타남: 누르면 여러 줄로 펼치기 / 접기 -->
      <button id="chMore" class="chmore" type="button" aria-expanded="false" aria-controls="chs" aria-label="채널 모두 펼치기" hidden>+</button>
    </div>
  </header>

  <!-- 상단 배너 광고 -->
  <div class="ad ad--top" id="adTop" hidden></div>

  <div class="layout">
    <aside class="rail rail--left" aria-label="광고"><div id="railL" hidden></div></aside>

    <main class="wrap">
      <section id="hero" class="hero" hidden></section>

      <!-- 자체 광고 배너 3칸 (관리자 > 메뉴·배너 에서 이미지·링크 편집) -->
      <section id="promo" class="promo" aria-label="광고" hidden></section>

      <!-- 채널별로 묶어 보기 (전체·장르 탭) -->
      <div id="shelves" class="shelves" hidden></div>

      <div class="toolbar">
        <div class="toolbar__left">
          <!-- "전체 보기"로 들어왔을 때만 보임: 누르면 원래 보던 화면·위치로 -->
          <button id="backBtn" class="backbtn" type="button" hidden><span aria-hidden="true">‹</span> 돌아가기</button>
          <h2 id="listTitle">최신 영상</h2>
        </div>
        <div class="toolbar__right">
          <span id="meta" class="muted"></span>
          <select id="sort" aria-label="정렬">
            <option value="new">최신순</option>
            <option value="views">조회수순</option>
          </select>
        </div>
      </div>

      <section id="grid" class="grid" aria-live="polite"></section>
      <div id="sentinel" class="sentinel"></div>
      <p id="empty" class="empty" hidden></p>
    </main>

    <!-- 오른쪽 세로 배너: 데스크톱에서만, 스크롤해도 따라오는 고정 배너 (애드센스 정책상 고정 광고는 이 하나만) -->
    <aside class="rail rail--right" aria-label="광고"><div class="rail__sticky" id="railR" hidden></div></aside>
  </div>

  <footer class="footer">
    <!-- 하단 배너 광고 -->
    <div class="ad ad--bottom" id="adBottom" hidden></div>
    <p>모든 영상의 저작권은 각 유튜브 채널과 제작자에게 있으며, 본 사이트는 YouTube 공식 플레이어로 재생합니다.<br />영상 게시 중단 요청은 소개 페이지의 연락처로 보내주세요.</p>
    <p><a href="about.html">소개</a> · <a href="privacy.html">개인정보처리방침</a></p>
  </footer>

  <!-- 새 영상 알림 -->
  <button id="toast" class="toast" hidden></button>

  <!-- 플레이어 (페이지 이탈 없이 재생) -->
  <div id="player" class="player" role="dialog" aria-modal="true" aria-labelledby="pTitle" hidden>
    <div class="player__backdrop" data-close></div>
    <div class="player__panel">
      <button class="player__close" data-close aria-label="닫기">✕</button>
      <div class="player__main">
        <div class="player__video"><div id="yt"></div></div>
        <div class="player__info">
          <h1 id="pTitle"></h1>
          <div class="player__sub">
            <span id="pChannel"></span>
            <span id="pMeta" class="muted"></span>
          </div>
          <div class="player__actions">
            <button id="pPrev" class="btn">◀ 이전</button>
            <button id="pNext" class="btn btn--primary">다음 ▶</button>
            <label class="switch"><input id="pAuto" type="checkbox" checked /> 자동 다음</label>
            <button id="pShare" class="btn">공유</button>
          </div>
          <p class="player__links">
            <a id="pYoutube" href="https://www.youtube.com" target="_blank" rel="noopener">YouTube에서 보기 ↗</a>
            <a id="pChannelLink" href="https://www.youtube.com" target="_blank" rel="noopener" hidden>채널 방문 ↗</a>
          </p>
          <p id="pDesc" class="player__desc"></p>
        </div>
        <div class="ad ad--player" id="playerAd" hidden></div>
      </div>
      <aside class="player__side">
        <h3>다음 영상</h3>
        <ol id="upnext" class="upnext"></ol>
      </aside>
    </div>
  </div>

  <script src="assets/app.js?v=20261121f" defer></script>
