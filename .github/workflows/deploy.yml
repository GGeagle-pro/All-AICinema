name: Cloudways 배포

# 코드를 수정해서 main 브랜치에 올리면(push) Cloudways 서버가 최신 코드를 자동으로 받아갑니다.
# 영상 자동 업데이트(update.yml)는 같은 배포 스크립트(scripts/cloudways-deploy.sh)를 자기 작업 안에서 직접 돌립니다.
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDWAYS_EMAIL     : Cloudways 로그인 이메일
#   CLOUDWAYS_API_KEY   : Cloudways → 계정 → API Integration 의 API 키 (배포할 때마다 1시간짜리 토큰을 새로 발급)
#   CLOUDWAYS_SERVER_ID : 서버 화면 주소창의 숫자 (…/server/123456/…)
#   CLOUDWAYS_APP_ID    : 앱 화면 주소창의 숫자 (…/apps/7654321/…)
#
# 보안: 토큰은 Cloudways에서 "Limited Access"로 만들고, 코드·로그에 절대 출력하지 않습니다.

on:
  push:
    branches: [main]
    # 관리자 저장(채널·사이트 설정)은 영상 자동 업데이트가 수집한 뒤 같이 배포하므로 여기선 건너뜀 (두 번 배포 방지)
    # 코드와 같이 바뀐 커밋은 그대로 배포됨
    paths-ignore: ["channels.json", "public/data/site.json"]
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDWAYS_EMAIL:
        required: false
      CLOUDWAYS_API_KEY:
        required: false
      CLOUDWAYS_API_TOKEN:
        required: false
      CLOUDWAYS_SERVER_ID:
        required: false
      CLOUDWAYS_APP_ID:
        required: false

# 이 작업은 저장소에 쓸 일이 없으므로 읽기 권한만
permissions:
  contents: read

concurrency:
  group: cloudways-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/cloudways-deploy.sh
          sparse-checkout-cone-mode: false
      - name: Cloudways 배포 (Git Pull + 캐시 비우기)
        env:
          CW_EMAIL: ${{ secrets.CLOUDWAYS_EMAIL }}
          CW_KEY: ${{ secrets.CLOUDWAYS_API_KEY }}
          CW_OLD: ${{ secrets.CLOUDWAYS_API_TOKEN }}
          CW_SERVER: ${{ secrets.CLOUDWAYS_SERVER_ID }}
          CW_APP: ${{ secrets.CLOUDWAYS_APP_ID }}
          GIT_URL: git@github.com:${{ github.repository }}.git
        run: bash scripts/cloudways-deploy.sh
