# 점검용 (series-preview 브랜치에서만): 채널 재생목록 확인. 아무것도 커밋하지 않음.
name: 작품 묶기 점검
on:
  push:
    branches: [series-preview]
    paths: ["scripts/series*.mjs", "scripts/youtube-api.mjs", ".github/workflows/series-check.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: live }
      - uses: actions/checkout@v4
        with: { path: work }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 재생목록 점검
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          cp live/public/data/videos.json work/public/data/videos.json
          cd work && node scripts/series-check.mjs
