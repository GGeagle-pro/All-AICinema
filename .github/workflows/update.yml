name: 영상 자동 업데이트

on:
  schedule:
    - cron: "7 * * * *"   # 1시간마다(매시 7분) 새 영상 확인 – 정각은 GitHub 이 붐벼서 늦어지므로 피함
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능
  push:
    branches: [main]
    paths: ["channels.json", "public/data/site.json"]  # 채널 목록·사이트 설정(관리자 저장)을 바꾸면 즉시 실행

# 기본은 읽기 전용, 커밋이 필요한 작업에만 쓰기 권한 부여 (최소 권한 원칙)
permissions:
  contents: read

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 영상 수집
        run: node scripts/fetch-videos.mjs
        env:
          # 선택: 있으면 공식 API로 채널의 예전 영상까지 수집 (없으면 RSS 최근 15개만)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: 변경 사항 저장
        id: commit
        env:
          # 다른 작업과 겹쳐 다시 수집할 때도 공식 API 사용 (채널 사진·외부 재생 확인이 빠지지 않게)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: >
          bash scripts/commit-and-push.sh
          "영상 목록 업데이트 $(date -u +'%Y-%m-%d %H:%M')"
          "node scripts/fetch-videos.mjs"
          channels.json public/data/videos.json public/data/desc.json public/data/meta.json public/sitemap.xml public/rss.xml public/index.html public/ko public/en public/ja public/zh public/es public/watch public/work public/tools public/faq public/top public/llms.txt cache/playlists.json cache/thumbs.json cache/embed.json

  # 새 영상이 저장되면 Cloudways 서버에도 반영
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit   # Cloudways 이메일·API 키·서버·앱 ID 를 그대로 넘김

  # 배포가 끝난 뒤 새·바뀐·삭제된 페이지를 Bing·네이버에 바로 알림 (IndexNow, 키는 공개용)
  indexnow:
    needs: [update, deploy]
    if: always() && needs.update.result == 'success' && (needs.deploy.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 검색엔진에 알리기
        run: node scripts/indexnow.mjs
        env:
          INDEXNOW: "1"
      - name: 보낸 기록 저장
        run: >
          bash scripts/commit-and-push.sh
          "검색엔진 알림 기록 $(date -u +'%Y-%m-%d %H:%M')"
          "INDEXNOW=1 node scripts/indexnow.mjs"
          cache/indexnow.json
