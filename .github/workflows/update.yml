name: 영상 자동 업데이트

# 한 작업(job) 안에서: 영상 수집 → 저장 → (바뀐 게 있으면) Cloudways 배포 → 검색엔진 알림 → 방문 통계·애드센스 새로 고침
# 작업을 하나로 합쳐서 실행마다 서버 준비 시간이 한 번만 듦 (GitHub Actions 사용 시간 절약)
on:
  schedule:
    # GitHub 예약 실행은 붐비면 자주 빠짐(하루 몇 번만 실행된 적 있음) → 30분마다 깨우고,
    # 마지막 수집이 100분이 안 지났으면 바로 끝냄 → 실제 수집은 약 2시간마다, 빠져도 30분 안에 다음 기회
    - cron: "17,47 * * * *"
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능 (항상 배포까지)
    inputs:
      mode:
        description: "full = 항상 배포까지 / tick = 예약 실행처럼 (Cloudways 크론이 2시간마다 보냄: 바뀐 게 있을 때만 배포)"
        required: false
        default: full
  push:
    branches: [main]
    paths: ["channels.json", "public/data/site.json"]  # 채널 목록·사이트 설정(관리자 저장)을 바꾸면 즉시 실행 (항상 배포까지)

# 기본은 읽기 전용, 이 작업에만 쓰기 권한 부여 (최소 권한 원칙)
permissions:
  contents: read

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 수집 간격 확인 (예약 실행만)
        id: gap
        if: github.event_name == 'schedule' || inputs.mode == 'tick'
        run: |
          last=$(node -e 'try{const m=require("./public/data/meta.json");console.log(Math.floor(Date.parse(m.generatedAt)/1000))}catch{console.log(0)}')
          age=$(( $(date +%s) - last ))
          echo "마지막 수집 후 $((age/60))분"
          if [ "$age" -lt 6000 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "100분이 안 지나서 이번 예약은 건너뜀"; fi
      - uses: actions/setup-node@v4
        if: steps.gap.outputs.skip != 'true'
        with:
          node-version: 22
      - name: 영상 수집
        if: steps.gap.outputs.skip != 'true'
        run: node scripts/fetch-videos.mjs
        env:
          # 선택: 있으면 공식 API로 채널의 예전 영상까지 수집 (없으면 RSS 최근 15개만)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: 변경 사항 저장
        id: commit
        if: steps.gap.outputs.skip != 'true'
        env:
          # 다른 작업과 겹쳐 다시 수집할 때도 공식 API 사용 (채널 사진·외부 재생 확인이 빠지지 않게)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: >
          bash scripts/commit-and-push.sh
          "영상 목록 업데이트 $(date -u +'%Y-%m-%d %H:%M')"
          "node scripts/fetch-videos.mjs"
          channels.json public/data/videos.json public/data/desc.json public/data/videos-recent.json public/data/guides.json public/data/desc public/data/meta.json public/sitemap.xml public/rss.xml public/index.html public/ko public/en public/ja public/zh public/es public/vi public/ar public/de public/fr public/it public/watch public/work public/tools public/faq public/top public/genre public/intro public/how-to public/advertise public/llms.txt cache/playlists.json cache/thumbs.json cache/embed.json

      # 새 영상·바뀐 페이지가 저장됐거나, 관리자 저장·수동 실행이면 Cloudways 서버에 반영
      # (자동 실행에서 바뀐 게 없으면 건너뜀 → 시간 절약)
      - name: Cloudways 배포
        id: deploy
        if: steps.gap.outputs.skip != 'true' && (steps.commit.outputs.changed == 'true' || (github.event_name != 'schedule' && inputs.mode != 'tick'))
        env:
          CW_EMAIL: ${{ secrets.CLOUDWAYS_EMAIL }}
          CW_KEY: ${{ secrets.CLOUDWAYS_API_KEY }}
          CW_OLD: ${{ secrets.CLOUDWAYS_API_TOKEN }}
          CW_SERVER: ${{ secrets.CLOUDWAYS_SERVER_ID }}
          CW_APP: ${{ secrets.CLOUDWAYS_APP_ID }}
          GIT_URL: git@github.com:${{ github.repository }}.git
        run: bash scripts/cloudways-deploy.sh

      # 배포가 끝난 뒤 새·바뀐·삭제된 페이지를 Bing·네이버에 바로 알림 (IndexNow, 키는 공개용)
      - name: 검색엔진에 알리기
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          INDEXNOW: "1"
        run: |
          git pull -q --rebase origin main || true
          node scripts/indexnow.mjs
          bash scripts/commit-and-push.sh "검색엔진 알림 기록 $(date -u +'%Y-%m-%d %H:%M')" "INDEXNOW=1 node scripts/indexnow.mjs" cache/indexnow.json

      # 관리자 > 통계 (GA 방문 통계 + 애드센스)를 실행마다 새로 – 따로 6시간마다 돌던 작업을 여기로 합침
      - name: 방문 통계·애드센스 새로 고침
        if: steps.gap.outputs.skip != 'true'
        continue-on-error: true
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_SA_KEY: ${{ secrets.GA_SA_KEY }}
          STATS_PASSWORD: ${{ secrets.STATS_PASSWORD }}
          ADSENSE_CLIENT_ID: ${{ secrets.ADSENSE_CLIENT_ID }}
          ADSENSE_CLIENT_SECRET: ${{ secrets.ADSENSE_CLIENT_SECRET }}
          ADSENSE_REFRESH_TOKEN: ${{ secrets.ADSENSE_REFRESH_TOKEN }}
        run: |
          git pull -q --rebase origin main || true
          node scripts/stats.mjs
          bash scripts/commit-and-push.sh "방문 통계 업데이트 $(date -u +'%Y-%m-%d %H:%M')" "node scripts/stats.mjs" stats/stats.enc.json
