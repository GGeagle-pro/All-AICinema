name: 이슈로 채널·영상 추가

# 휴대폰 GitHub 앱이나 웹에서 "채널·영상 추가" 이슈를 열면
# 링크를 channels.json 에 반영 → 영상 수집 → 사이트 배포 → 결과를 답글로 달고 이슈를 닫습니다.

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: add-links
  cancel-in-progress: false

jobs:
  add:
    # 보안: 저장소 주인이 연 "[추가]" 이슈만 처리 (다른 사람이 연 이슈는 무시)
    if: >
      startsWith(github.event.issue.title, '[추가]') &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 링크 반영
        env:
          # 이슈 내용은 환경변수로만 전달 (명령어에 직접 넣으면 명령어 주입 위험)
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/add-from-issue.mjs | tee "$RUNNER_TEMP/result.md"

      - name: 영상 수집
        run: node scripts/fetch-videos.mjs

      - name: 변경 사항 저장
        id: commit
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: >
          bash scripts/commit-and-push.sh
          "이슈 #${{ github.event.issue.number }}: 채널·영상 목록 변경"
          "node scripts/add-from-issue.mjs > \"$RUNNER_TEMP/result.md\" && node scripts/fetch-videos.mjs"
          channels.json public/data/videos.json public/data/desc.json public/data/meta.json public/sitemap.xml public/rss.xml public/index.html public/en public/ja public/zh public/es public/watch public/work public/tools cache/playlists.json cache/thumbs.json

      - name: 결과 답글 달고 이슈 닫기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          [ -s "$RUNNER_TEMP/result.md" ] || echo "❌ 처리하지 못했어요. Actions 탭의 로그를 확인해 주세요." > "$RUNNER_TEMP/result.md"
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/result.md"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"

  deploy:
    needs: add
    if: needs.add.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit   # Cloudways 이메일·API 키·서버·앱 ID 를 그대로 넘김
